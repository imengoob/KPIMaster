[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Treat asyncio warnings as errors only if they're from our code
filterwarnings =
    error::DeprecationWarning:app.*
    ignore::DeprecationWarning:sqlalchemy.*
    ignore::DeprecationWarning:anyio.*
    ignore::pytest.PytestUnraisableExceptionWarning

# Coverage defaults (override on CLI as needed)
addopts = --tb=short -q
